name: Build and generate reports

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and generate site reports
        run: mvn --batch-mode --file whackamole/pom.xml test site

      - name: Upload Javadoc and JaCoCo reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: java-reports
          path: |
            whackamole/target/site/reports/apidocs
            whackamole/target/site/jacoco
          if-no-files-found: error
